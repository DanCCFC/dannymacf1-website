name: Check TikTok LIVE status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiktok-live-status
  cancel-in-progress: true

jobs:
  check-live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install checker
        run: pip install TikTokLive
      - name: Check public LIVE status
        env:
          TIKTOK_USERNAME: DannyMacF1
        run: python scripts/check_live.py
      - name: Publish status file if changed
        run: |
          if ! git diff --quiet -- status.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add status.json
            git commit -m "Update TikTok LIVE status"
            git push
          fi
