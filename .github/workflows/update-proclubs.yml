name: Update TTDM United Pro Clubs data

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ttdm-united-proclubs
  cancel-in-progress: true

jobs:
  update-club-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch TTDM United data from EA
        env:
          FC_CLUB_NAME: TTDM United
          FC_PLATFORM: common-gen5
        run: python scripts/update_proclubs.py
      - name: Publish data snapshot if changed
        run: |
          if ! git diff --quiet -- proclubs.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add proclubs.json
            git commit -m "Update TTDM United Pro Clubs data"
            git push
          fi
